[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycm30"
version = "0.1.0"
description = "Python library for interfacing with the Olympus CM30 incubation monitor via HTTP API"
readme = "README"
authors = [
    { name = "Richard Bryan" }
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["cm30", "microscopy", "incubation", "olympus", "imaging"]

dependencies = [
    "click>=8.0",
    "requests>=2.25",
    "Pillow>=9.0",
    "numpy>=2.4.1",
    "dearpygui>=2.1.1"
]

[project.optional-dependencies]
analysis = [
    "opencv-python>=4.5",
    "pandas>=1.3",
    "stitching>=0.4",
]
gui = [
    "watchdog>=3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
all = [
    "pycm30[analysis,gui,dev]",
]

[project.scripts]
pycm30 = "pycm30.cli:cmds"
pycm30-control = "tools.controller.main:main"

[project.urls]
Homepage = "https://github.com/rabryan/pycm30"
Repository = "https://github.com/rabryan/pycm30"

[tool.setuptools.packages.find]
where = ["."]
include = ["pycm30*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
